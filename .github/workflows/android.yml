name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate launcher icons
        run: |
          python3 - <<'PY'
import os
from PIL import Image

src = "resources/icon.png"
if not os.path.exists(src):
    print("no icon, skip")
    raise SystemExit(0)

img = Image.open(src).convert("RGBA")

sizes = {
    "mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96,
    "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192
}
base = "android/app/src/main/res"
for folder, px in sizes.items():
    d = os.path.join(base, folder)
    os.makedirs(d, exist_ok=True)
    img.resize((px, px), Image.LANCZOS).save(os.path.join(d, "ic_launcher.png"))
    # 圆形图标
    ic = img.resize((px, px), Image.LANCZOS)
    mask = Image.new("L", (px, px), 0)
    from PIL import ImageDraw
    ImageDraw.Draw(mask).ellipse([0, 0, px-1, px-1], fill=255)
    rnd = Image.new("RGBA", (px, px), (0,0,0,0))
    rnd.paste(ic, (0,0), mask)
    rnd.save(os.path.join(d, "ic_launcher_round.png"))
    print("wrote", folder, px)

# 自适应图标前景
fg_dir = os.path.join(base, "mipmap-xxxhdpi")
fg = Image.new("RGBA", (432, 432), (0,0,0,0))
inner = img.resize((280, 280), Image.LANCZOS)
fg.paste(inner, (76, 76), inner)
fg.save(os.path.join(fg_dir, "ic_launcher_foreground.png"))
print("wrote foreground")
PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oink-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload mapping (if release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: android/app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
