name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME 2>/dev/null || true

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Apply custom icons
        run: |
          set -e
          RES=android/app/src/main/res
          echo "--- before ---"
          find "$RES" -name "ic_launcher*" | sort

          # 1. 删除 Capacitor 默认的 vector / 自适应 XML
          find "$RES" -name "ic_launcher_foreground.xml" -delete || true
          find "$RES" -path "*drawable*" -name "*ic_launcher_foreground*" -delete || true
          rm -rf "$RES"/mipmap-anydpi-v26 || true
          rm -rf "$RES"/mipmap-anydpi || true

          # 2. 复制 PNG 到各密度
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${pair%%:*}"
            mkdir -p "$RES/mipmap-$name"
            cp "resources/icon-$name.png"       "$RES/mipmap-$name/ic_launcher.png"
            cp "resources/icon-$name-round.png" "$RES/mipmap-$name/ic_launcher_round.png"
          done

          # 3. 生成自定义自适应图标（指向 PNG foreground）
          #    指向 mipmap/ic_launcher_foreground (PNG)，非 vector
          mkdir -p "$RES/mipmap-anydpi-v26"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          # 4. 每密度都放 background（纯色图片）和 foreground
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${pair%%:*}"
            size="${pair##*:}"
            mkdir -p "$RES/mipmap-$name"
            # 背景：纯深色方块，尺寸和图标一致
            cp "resources/icon-$name.png" "$RES/mipmap-$name/ic_launcher_background.png"
          done
          cp resources/adaptive-foreground.png "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png"
          cp resources/adaptive-foreground.png "$RES/mipmap-xxhdpi/ic_launcher_foreground.png"
          cp resources/adaptive-foreground.png "$RES/mipmap-xhdpi/ic_launcher_foreground.png"
          cp resources/adaptive-foreground.png "$RES/mipmap-hdpi/ic_launcher_foreground.png"
          cp resources/adaptive-foreground.png "$RES/mipmap-mdpi/ic_launcher_foreground.png"

          echo "--- after ---"
          find "$RES" -name "ic_launcher*" | sort

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: oink-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
